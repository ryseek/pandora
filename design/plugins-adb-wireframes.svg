    <text x="70" y="145" class="eyebrow">01 · DISCOVER</text>
    <text x="498" y="145" class="eyebrow">02 · ENABLE</text>
    <text x="926" y="145" class="eyebrow">03 · CONNECT</text>
    <text x="1354" y="145" class="eyebrow">04 · CONTROL</text>
  </g>

