    <rect x="1126" y="586" width="154" height="52" rx="12" fill="#FFFFFF" stroke="#D8D9D2"/><text x="1143" y="618" class="body muted">000 000</text>
    <rect x="950" y="662" width="330" height="52" rx="15" fill="#6654D9"/><text x="1115" y="694" class="body white" text-anchor="middle" font-weight="750">Pair and test</text>
